[project]
name = "fuehrerscheintest-data"
version = "0.1.0"
description = "Checks the question bank and builds the catalogue and traffic-sign drawings"
requires-python = ">=3.15"
license = "MIT"
dependencies = []

[dependency-groups]
# Tools live here, pinned by uv.lock, so their rulesets cannot change between runs.
dev = [
  "pyrefly>=1.5.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-random-order>=1.2.0",
  "ruff>=0.17.5",
  "ty>=0.0.107",
]

[tool.uv]
# Allow newly published dependencies immediately.
exclude-newer = false
package = false

[tool.pytest]
# pytest 9 strict mode: rejects unknown config keys and markers, makes
# unexpectedly passing xfails fail, and forbids duplicate parametrisation ids.
strict = true
addopts = [
  # pytest-random-order shuffles tests on every run so order dependencies surface.
  "--random-order",
  "--cov=.",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=98",
]
# Warnings are failures: a deprecation is exactly the early signal to act on.
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["."]

[tool.ruff]
target-version = "py315"
preview = true
line-length = 100
indent-width = 4

[tool.ruff.lint]
# Start from Ruff's complete stable and preview ruleset; exceptions below are
# formatter conflicts or project conventions, each explained.
select = ["ALL"]
ignore = [
  # Ruff's formatter owns trailing-comma layout.
  "missing-trailing-comma",
  # No copyright headers or public docstrings required; functions carry
  # short docstrings where they help.
  "CPY",
  "D",
  "DOC",
]

[tool.ruff.lint.flake8-tidy-imports]
require-lazy = "all"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-branches = 6
max-returns = 3
max-statements = 20

[tool.ruff.lint.per-file-ignores]
# Command-line reporting: stdout and stderr are the build's interface.
"build_data.py" = ["print"]
# The parsed XML is the sign drawings this project generates itself.
"test_signs.py" = [
  "suspicious-xml-element-tree-usage",
  "suspicious-xml-etree-import",
]
# Tests call assert, compare fixture values and exercise private helpers.
"test_*.py" = ["assert", "magic-value-comparison", "private-member-access"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
# Every diagnostic, including those ty leaves off by default.
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true
