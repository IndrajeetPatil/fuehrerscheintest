[questions.en]
q = "Fog has cut visibility to less than 50 m. What is the highest speed you may drive at?"
o = ["30 km/h", "50 km/h", "80 km/h"]
why = "When fog, snow or rain cut visibility below 50 m, the limit is 50 km/h, or lower if the conditions call for it."

