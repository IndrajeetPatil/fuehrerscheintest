[questions.de]
q = "Sie fahren in einen Kreisverkehr ein, an dessen Einfahrt das Zeichen „Vorfahrt gewähren“ steht. Was gilt?"
o = [
  "Der Verkehr auf der Kreisfahrbahn hat Vorfahrt",
  "Beim Einfahren darf ich nicht blinken",
  "Beim Einfahren muss ich links blinken",
]
why = "Steht das Zeichen 215 (Kreisverkehr) unter Zeichen 205, hat der Verkehr im Kreis Vorfahrt. Beim Einfahren ist der Blinker unzulässig; innerhalb des Kreisverkehrs darf man auf der Fahrbahn nicht halten."

[questions.en]
q = "You are entering a roundabout with a give-way sign at the entry. What applies?"
o = [
  "Traffic on the roundabout has priority",
  "I must not indicate when entering",
  "I must indicate left when entering",
]
why = "Where sign 215 (roundabout) stands below sign 205, traffic on the roundabout has priority. Indicating when entering is not allowed, and you must not stop on the roundabout's carriageway."

