[questions.de]
q = "Ein Polizeibeamter regelt eine Kreuzung mit Ampel und Verkehrszeichen. Wonach richten Sie sich?"
o = [
  "Nach den Zeichen des Polizeibeamten",
  "Nach der Ampel",
  "Nach den Verkehrszeichen",
]
