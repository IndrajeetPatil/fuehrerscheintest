[questions.de]
q = "Wann ist Überholen verboten?"
o = [
  "Bei unklarer Verkehrslage",
  "Wenn ich nicht übersehen kann, dass der Gegenverkehr nicht behindert wird",
  "Wenn das Fahrzeug vor mir langsamer als erlaubt fährt",
]
why = "Überholen darf nur, wer übersehen kann, dass während des ganzen Überholvorgangs jede Behinderung des Gegenverkehrs ausgeschlossen ist. Bei unklarer Verkehrslage ist es unzulässig."

[questions.en]
q = "When is overtaking prohibited?"
o = [
  "When the traffic situation is unclear",
  "When I cannot see that oncoming traffic will not be hindered",
  "When the vehicle ahead is driving below the limit",
]
why = "You may overtake only if you can see that oncoming traffic will not be hindered at any point during the manoeuvre. Overtaking is prohibited when the traffic situation is unclear."

