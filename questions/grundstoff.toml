]
why = "Gelb ordnet an, vor der Kreuzung auf das nächste Zeichen zu warten. Wer so nah ist, dass er nur mit einer Gefahrbremsung halten könnte, fährt vorsichtig weiter."

[questions.en]
q = "The light changes from green to amber. How do you behave?"
o = [
  "I stop before the crossroads if I can with normal braking",
  "I speed up to get through",
  "If I can no longer stop safely, I carry on with care",
]
