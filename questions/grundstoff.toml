o = [
  "The priority road ends",
  "At the next crossroads I must expect a different priority rule",
  "From here, the speed limit is 30 km/h",
]
why = "Sign 307 ends the priority road. At the next crossroads, whatever is signed there applies, otherwise priority from the right."

