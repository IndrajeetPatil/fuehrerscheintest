[questions.en]
q = "What is the minimum gap you keep to the vehicle ahead outside built-up areas?"
o = [
  "About the distance I cover in two seconds",
  "One car length",
  "About 10 m at any speed",
]
why = "The gap must let you stop even if the vehicle ahead brakes suddenly. Rules of thumb: a two-second gap, or half your speed in metres."

