[questions.de]
q = "Wie lang ist nach den Faustformeln der Anhalteweg bei einer normalen Bremsung aus 100 km/h?"
o = ["100 m", "130 m", "200 m"]
why = "Anhalteweg = Reaktionsweg + Bremsweg. Bei 100 km/h: 10 × 3 = 30 m Reaktionsweg plus 10 × 10 = 100 m Bremsweg, zusammen 130 m."

[questions.en]
q = "By the rules of thumb, what is the stopping distance of a normal stop from 100 km/h?"
o = ["100 m", "130 m", "200 m"]
why = "Stopping distance = reaction distance + braking distance. At 100 km/h: 10 × 3 = 30 m reaction distance plus 10 × 10 = 100 m braking distance, 130 m in all."

[[questions]]
