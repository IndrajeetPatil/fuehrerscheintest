]
why = "Ein hochgehobener Arm wirkt wie Gelb an der Ampel: Vor der Kreuzung auf das nächste Zeichen warten. Wer bereits in der Kreuzung ist, muss sie räumen."

[questions.en]
q = "A police officer at a crossroads raises one arm straight up. What does that mean?"
o = [
  "Everyone waits before the crossroads for the next signal",
  "Crossing traffic may go",
  "Anyone already in the crossroads must clear it",
]
why = "A raised arm works like an amber light: wait before the crossroads for the next signal. Anyone already in the crossroads must clear it."

