  "Man soll so früh wie möglich auf den durchgehenden Fahrstreifen wechseln",
  "Wer auf dem durchgehenden Fahrstreifen fährt, muss den Wechsel ermöglichen",
]
why = "Beim Reißverschlussverfahren ordnen sich die Fahrzeuge erst unmittelbar vor der Verengung abwechselnd ein. Der Verkehr auf dem durchgehenden Fahrstreifen muss das ermöglichen."

[questions.en]
q = "A lane is ending and traffic is heavy. What applies?"
o = [
  "Vehicles merge in turn just before the lane narrows",
  "Drivers should move into the continuing lane as early as possible",
  "Drivers in the continuing lane must let others merge",
]
why = "Under the zip-merge rule, vehicles merge in turn only just before the narrowing. Traffic in the continuing lane must make that possible."

