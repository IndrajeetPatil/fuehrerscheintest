[questions.de]
q = "Sie wollen nach dem Parken auf der Fahrbahnseite aussteigen. Was beachten Sie?"
o = [
  "Vor dem Öffnen auf den nachfolgenden Verkehr achten, auch auf Radfahrer",
  "Die Tür mit der rechten Hand öffnen, so dass ich mich umdrehe und nach hinten sehe",
  "Die Tür schnell und weit aufstoßen",
]
why = "Wer aussteigt, muss eine Gefährdung anderer ausschließen. Der Blick in Spiegel und über die Schulter, unterstützt durch den „holländischen Griff“, schützt vor allem Radfahrer vor einer plötzlich geöffneten Tür."

[questions.en]
q = "After parking, you want to get out on the traffic side. What do you watch for?"
o = [
  "Check for traffic from behind before opening, including cyclists",
  "Open the door with my right hand, so I turn and look back",
  "Push the door open quickly and wide",
]
why = "Anyone getting out must rule out endangering others. Checking the mirror and over your shoulder, helped by the “Dutch reach”, protects cyclists above all from a door opening suddenly."

