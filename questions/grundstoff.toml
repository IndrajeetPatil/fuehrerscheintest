[questions.de]
q = "Wann müssen Sie rechts überholen?"
o = [
  "Wenn das Fahrzeug vor mir links abbiegen will und sich eingeordnet hat",
  "Auf der Autobahn, wenn links langsam gefahren wird",
  "Eine Straßenbahn, die auf der Fahrbahnmitte fährt",
]
why = "Wer links abbiegen will und sich eingeordnet hat, ist rechts zu überholen, ebenso Schienenfahrzeuge. Langsamer Verkehr links ist dagegen kein Grund, rechts zu überholen."

[questions.en]
q = "When must you overtake on the right?"
o = [
  "When the vehicle ahead wants to turn left and has moved over",
  "On the motorway, when traffic on the left is slow",
  "A tram running in the middle of the road",
]
why = "A vehicle that has signalled and moved over to turn left must be overtaken on the right, and so must trams. Slow traffic on the left is no reason to overtake on the right."

[[questions]]
