why = "Wer sein Fahrzeug verlässt oder länger als drei Minuten hält, der parkt. Verkehrsbedingtes Warten ist weder Halten noch Parken."

[questions.en]
q = "When are you parking?"
o = [
  "When I stop for more than three minutes",
  "When I leave my vehicle",
  "When I wait at a red light because of the traffic",
]
why = "Leaving your vehicle, or stopping for more than three minutes, counts as parking. Waiting because of traffic is neither stopping nor parking."

