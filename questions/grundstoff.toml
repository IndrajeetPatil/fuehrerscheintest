[questions.de]
q = "Wie verändert sich der Bremsweg, wenn sich die Geschwindigkeit verdoppelt?"
o = ["Er verdoppelt sich", "Er vervierfacht sich", "Er bleibt gleich"]
why = "Der Bremsweg wächst mit dem Quadrat der Geschwindigkeit: doppelte Geschwindigkeit, vierfacher Bremsweg."

[questions.en]
q = "How does the braking distance change when speed doubles?"
o = ["It doubles", "It quadruples", "It stays the same"]
why = "Braking distance grows with the square of speed: twice the speed means four times the braking distance."

