  "Außerorts darf ich auf der Fahrbahn nicht parken",
  "An der nächsten Kreuzung gilt „rechts vor links“",
]
why = "Zeichen 306 kennzeichnet eine Vorfahrtstraße; die Vorfahrt gilt bis zum nächsten Zeichen 205, 206 oder 307. Außerhalb geschlossener Ortschaften ist das Parken auf ihrer Fahrbahn verboten."

[questions.en]
q = "What does this sign mean?"
o = [
  "I am on a priority road",
  "Outside built-up areas, I must not park on the carriageway",
  "Priority from the right applies at the next crossroads",
]
why = "Sign 306 marks a priority road; priority lasts until the next sign 205, 206 or 307. Outside built-up areas, parking on its carriageway is prohibited."

