[questions.de]
q = "Nachts steht ein Reh im Scheinwerferlicht auf der Fahrbahn. Was tun Sie?"
o = [
  "Abblenden und hupen",
  "Bremsen, wenn nötig bis zum Stillstand",
  "Ruckartig ausweichen",
  "Das Fernlicht anlassen, damit das Tier besser sieht",
]
why = "Fernlicht lässt Wild erstarren. Abblenden und hupen vertreibt es, und kontrolliertes Bremsen ist sicherer als ein Ausweichmanöver, das in den Gegenverkehr oder gegen einen Baum führen kann."

[questions.en]
q = "At night a deer is standing in your headlights on the road. What do you do?"
o = [
  "Dip the headlights and sound the horn",
  "Brake, to a standstill if necessary",
  "Swerve sharply",
  "Keep the full beam on so the animal can see better",
]
why = "Full beam makes wild animals freeze. Dipping the lights and sounding the horn drives them off, and controlled braking is safer than swerving into oncoming traffic or a tree."

