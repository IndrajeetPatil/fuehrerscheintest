  "Ich habe bis zum Ende der Straße Vorfahrt",
  "An der nächsten Kreuzung gilt „rechts vor links“",
]
why = "Zeichen 301 gibt die Vorfahrt nur an der nächsten Kreuzung oder Einmündung. Danach gelten wieder die allgemeinen Regeln, solange kein neues Zeichen steht."

[questions.en]
q = "What does this sign mean?"
o = [
  "I have priority at the next crossroads or junction",
  "I have priority until the end of the road",
  "Priority from the right applies at the next crossroads",
]
why = "Sign 301 gives priority at the next crossroads or junction only. After it, the general rules apply again unless another sign says otherwise."

[[questions]]
