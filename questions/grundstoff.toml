# Grundstoff: the basic questions every licence class shares. Twenty of the
# thirty questions in a class B exam come from here.
#
# Each question is an original practice question written from the cited
# legal text, not a copy of the official TÜV | DEKRA catalogue. `correct`
# lists the indices of every correct option (at least one); `points` is the
# number of error points a wrong answer costs (2 to 5). Run `make data` after
# editing; scripts/build_data.py validates every entry.

[[questions]]
id = "G001"
topic = "vorfahrt"
points = 5
sign = "z205"
law = "§ 8 StVO"
correct = [0, 2]

[questions.de]
q = "Was müssen Sie an diesem Verkehrszeichen tun?"
o = [
  "Vorfahrt gewähren",
  "Immer anhalten, auch wenn die Straße frei ist",
  "Notfalls anhalten, wenn ich Vorfahrtberechtigte sonst gefährden oder wesentlich behindern würde",
]
why = "Zeichen 205 verlangt, die Vorfahrt zu gewähren. Ein Halt ist nur nötig, wenn die Vorfahrtberechtigten sonst gefährdet oder wesentlich behindert würden; anders als beim Stoppschild muss man nicht in jedem Fall anhalten."

[questions.en]
q = "What must you do at this sign?"
o = [
  "Give way",
  "Always stop, even if the road is clear",
  "Stop if necessary, when I would otherwise endanger or significantly hinder traffic with priority",
]
why = "Sign 205 means give way. You only need to stop when you would otherwise endanger or significantly hinder traffic with priority; unlike a stop sign, it does not require a stop every time."

[[questions]]
id = "G002"
topic = "vorfahrt"
points = 5
sign = "z206"
law = "Anlage 2 StVO"
correct = [0, 1]

[questions.de]
q = "Wo müssen Sie an diesem Verkehrszeichen anhalten?"
o = [
  "An der Haltlinie, wenn eine vorhanden ist",
  "Ohne Haltlinie dort, wo ich die andere Straße übersehen kann",
  "Nur wenn Querverkehr kommt",
]
why = "Bei Zeichen 206 muss man immer anhalten und Vorfahrt gewähren, auch bei freier Straße. Gehalten wird an der Haltlinie oder, wenn keine vorhanden ist, dort, wo die andere Straße zu übersehen ist."

[questions.en]
q = "Where must you stop at this sign?"
o = [
  "At the stop line, if there is one",
  "Without a stop line, where I can see along the other road",
  "Only if there is crossing traffic",
]
why = "Sign 206 requires a full stop and giving way every time, even on an empty road. Stop at the stop line or, if there is none, where you can see along the other road."

[[questions]]
id = "G003"
topic = "vorfahrt"
points = 5
law = "§ 8 StVO"
correct = [0]

[questions.de]
q = "An einer Kreuzung gibt es weder Verkehrszeichen noch Ampeln. Wer hat Vorfahrt?"
o = [
  "Wer von rechts kommt",
  "Wer geradeaus fährt",
  "Wer auf der breiteren Straße fährt",
]
why = "Ohne Verkehrszeichen, Ampel oder Polizei gilt „rechts vor links“. Breite oder Ausbau der Straße spielen keine Rolle."

[questions.en]
q = "A crossroads has neither signs nor traffic lights. Who has priority?"
o = [
  "Whoever comes from the right",
  "Whoever is going straight on",
  "Whoever is on the wider road",
]
why = "Without signs, lights or police, traffic from the right has priority. The width or surface of the road makes no difference."

[[questions]]
id = "G004"
topic = "vorfahrt"
points = 5
law = "§ 8 StVO"
correct = [0]

[questions.de]
q = "Sie kommen aus einem Feldweg auf eine Straße. Wer hat Vorfahrt?"
o = [
  "Der Verkehr auf der Straße, auch wenn er von links kommt",
  "Ich, wenn ich von rechts komme",
  "Wer zuerst an der Einmündung ankommt",
]
why = "Wer aus einem Feld- oder Waldweg kommt, hat keine Vorfahrt nach „rechts vor links“. Der Verkehr auf der Straße darf zuerst fahren, von welcher Seite er auch kommt."

[questions.en]
q = "You are coming out of a farm track onto a road. Who has priority?"
o = [
  "The traffic on the road, even when it comes from the left",
  "I do, if I come from the right",
  "Whoever reaches the junction first",
]
why = "Traffic coming out of a farm or forest track does not get priority from the right. Traffic on the road goes first, whichever side it comes from."

[[questions]]
