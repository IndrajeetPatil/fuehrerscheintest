[questions.de]
q = "Bei starkem Regen wird die Lenkung plötzlich leicht – Aquaplaning. Was tun Sie?"
o = [
  "Gas wegnehmen und auskuppeln",
  "Kräftig bremsen",
  "Das Lenkrad ruhig halten",
]
why = "Beim Aquaplaning schwimmen die Reifen auf. Gas wegnehmen und auskuppeln, das Lenkrad gerade halten und nicht bremsen, bis die Reifen wieder greifen."

[questions.en]
q = "In heavy rain the steering suddenly feels light: aquaplaning. What do you do?"
o = [
  "Ease off the accelerator and press the clutch",
  "Brake hard",
  "Keep the steering wheel steady",
]
why = "When aquaplaning, the tyres float on the water. Ease off, press the clutch, hold the wheel straight and do not brake until the tyres grip again."

