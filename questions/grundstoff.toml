  "Der Gegenverkehr muss mich abbiegen lassen",
  "Wer zuerst an der Kreuzung ist, fährt zuerst",
]
why = "Wer links abbiegt, muss entgegenkommende Fahrzeuge durchfahren lassen, auch Straßenbahnen und Fahrräder."

[questions.en]
q = "You want to turn left at a crossroads. An oncoming car wants to go straight on. Who must wait?"
o = [
  "I must let the oncoming traffic through",
  "The oncoming traffic must let me turn",
  "Whoever reaches the crossroads first goes first",
]
why = "Drivers turning left must let oncoming vehicles through, including trams and bicycles."

[[questions]]
