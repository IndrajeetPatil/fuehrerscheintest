[questions.de]
q = "Sie biegen rechts ab. Ein Radfahrer fährt neben Ihnen auf dem Radweg geradeaus weiter, Fußgänger gehen über die Straße, in die Sie abbiegen. Was tun Sie?"
o = [
  "Den Radfahrer geradeaus durchfahren lassen",
  "Auf die Fußgänger besondere Rücksicht nehmen und wenn nötig warten",
  "Zügig vor dem Radfahrer abbiegen, da ich schneller bin",
]
why = "Wer abbiegt, muss Fahrräder durchfahren lassen, die in gleicher Richtung auf oder neben der Fahrbahn fahren. Auf Fußgänger ist besondere Rücksicht zu nehmen; wenn nötig, muss man warten."

[questions.en]
q = "You are turning right. A cyclist beside you on the cycle lane is going straight on, and pedestrians are crossing the road you are turning into. What do you do?"
o = [
  "Let the cyclist go straight on first",
  "Take particular care of the pedestrians and wait if necessary",
  "Turn quickly in front of the cyclist, since I am faster",
]
why = "Drivers turning must let through bicycles travelling the same way on or beside the carriageway. Pedestrians need particular care; wait if necessary."

