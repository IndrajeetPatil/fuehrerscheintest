why = "Unter anderem ist das Parken vor Grundstücksein- und -ausfahrten und bis zu je 5 m vor und hinter Kreuzungen und Einmündungen unzulässig, vor Kreuzungen mit baulichem Radweg rechts sogar bis 8 m."

[questions.en]
