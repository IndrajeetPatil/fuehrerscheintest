o = [
  "Turning round",
  "Reversing",
  "Stopping, including on the hard shoulder",
  "Driving in the right-hand lane",
]
why = "On motorways and expressways, turning round, reversing and stopping, even on the hard shoulder, are prohibited. Stopping is allowed only in an emergency or a breakdown."

