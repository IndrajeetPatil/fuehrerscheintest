q = "Ein Linienbus steht mit eingeschaltetem Warnblinklicht an einer Haltestelle. Wie verhalten Sie sich?"
o = [
  "Nur mit Schrittgeschwindigkeit vorbeifahren, auch im Gegenverkehr",
  "Wenn nötig warten, damit Fahrgäste nicht gefährdet werden",
  "Zügig vorbeifahren, bevor die Fahrgäste aussteigen",
]
why = "An haltenden Linien- und Schulbussen mit Warnblinklicht darf nur mit Schrittgeschwindigkeit und mit ausreichendem Abstand vorbeigefahren werden. Das gilt auch für den Gegenverkehr; wenn nötig, muss man warten."

[questions.en]
q = "A service bus is standing at a stop with its hazard lights on. How do you behave?"
o = [
  "Pass only at walking pace, even in the opposite direction",
  "Wait if necessary, so that passengers are not endangered",
  "Pass quickly, before the passengers get off",
]
why = "Service and school buses at a stop with hazard lights on may be passed only at walking pace and with enough room. This applies to oncoming traffic too; wait if necessary."

