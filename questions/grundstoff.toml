topic = "vorfahrt"
points = 5
law = "§ 10 StVO"
correct = [0, 1]

[questions.de]
q = "Sie wollen aus einer Grundstücksausfahrt auf die Straße fahren. Was gilt?"
o = [
  "Ich muss eine Gefährdung anderer ausschließen",
  "Wenn nötig, lasse ich mich einweisen",
  "Fußgänger auf dem Gehweg müssen mich vorbeilassen",
]
why = "Wer aus einem Grundstück auf die Straße fährt, muss eine Gefährdung anderer ausschließen und sich erforderlichenfalls einweisen lassen. Fußgänger und der fließende Verkehr gehen vor."

[questions.en]
q = "You want to drive out of a property onto the road. What applies?"
o = [
  "I must rule out endangering anyone",
  "If necessary, I have someone guide me out",
  "Pedestrians on the pavement must let me through",
]
why = "Drivers leaving a property must rule out endangering others and, if necessary, be guided out. Pedestrians and moving traffic come first."

