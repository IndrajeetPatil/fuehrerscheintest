  "Auf Brücken",
  "In Waldschneisen",
  "Auf beleuchteten Straßen in der Ortsmitte",
]
why = "Brücken kühlen von unten und oben aus, und in Waldschneisen kommt kaum Sonne hin. Dort friert die Fahrbahn zuerst und taut zuletzt."

[questions.en]
q = "Where must you particularly expect ice when temperatures are around freezing?"
o = [
  "On bridges",
  "In clearings through woods",
  "On lit streets in a town centre",
]
why = "Bridges cool from above and below, and little sun reaches woodland clearings. The road freezes there first and thaws last."

[[questions]]
