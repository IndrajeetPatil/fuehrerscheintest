law = "§ 37 StVO"
correct = [0, 2]

[questions.de]
q = "Die Ampel zeigt Rot, rechts daneben hängt dieses Schild. Was gilt, wenn Sie rechts abbiegen wollen?"
o = [
  "Nach dem Anhalten darf ich rechts abbiegen",
  "Ich darf ohne anzuhalten rechts abbiegen",
  "Fußgänger und Fahrzeuge der freigegebenen Richtung darf ich weder behindern noch gefährden",
]
why = "Mit dem Grünpfeil ist das Rechtsabbiegen bei Rot erst nach dem Anhalten erlaubt. Eine Behinderung oder Gefährdung anderer, vor allem des Fußgänger- und Fahrzeugverkehrs der freigegebenen Richtung, muss ausgeschlossen sein."

[questions.en]
q = "The light is red and this sign hangs to its right. What applies if you want to turn right?"
o = [
  "After stopping, I may turn right",
  "I may turn right without stopping",
  "I must neither hinder nor endanger pedestrians and vehicles that have a green light",
]
why = "The green arrow allows a right turn on red only after a full stop. You must rule out hindering or endangering anyone, especially pedestrians and vehicles in the direction that has green."

