why = "Beim Überholen von Fußgängern, Radfahrern und E-Scooter-Fahrern mit einem Kraftfahrzeug beträgt der Seitenabstand innerorts mindestens 1,5 m und außerorts mindestens 2 m."

[questions.en]
q = "You are overtaking a cyclist. What is the minimum side clearance you must leave?"
o = [
  "1.5 m in built-up areas",
  "2 m outside built-up areas",
  "1 m in built-up areas",
  "1.5 m outside built-up areas",
]
why = "When a motor vehicle overtakes pedestrians, cyclists or e-scooter riders, the side clearance must be at least 1.5 m in built-up areas and 2 m outside them."

