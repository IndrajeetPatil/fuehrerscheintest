[questions.de]
q = "Zwischen geparkten Autos rollt ein Ball auf die Fahrbahn. Womit müssen Sie rechnen?"
o = [
  "Dass ein Kind hinterherläuft",
  "Nur mit dem Ball; Kinder achten auf den Verkehr",
  "Dass der Ball von allein liegen bleibt",
]
why = "Kinder laufen einem Ball oft ohne auf den Verkehr zu achten hinterher. Gegenüber Kindern muss man sich so verhalten, dass ihre Gefährdung ausgeschlossen ist: langsamer fahren und bremsbereit sein."

[questions.en]
q = "A ball rolls onto the road between parked cars. What must you expect?"
o = [
  "A child running after it",
  "Only the ball; children watch the traffic",
  "That the ball will stop by itself",
]
why = "Children often run after a ball without looking at the traffic. Around children you must rule out endangering them: slow down and be ready to brake."

