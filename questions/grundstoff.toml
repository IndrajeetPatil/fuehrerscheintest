law = "§ 3 StVO"
correct = [0, 1]

[questions.de]
q = "Am Fahrbahnrand steht ein älterer Mensch, der unsicher wirkt und die Straße überqueren möchte. Wie verhalten Sie sich?"
o = [
  "Ich verringere die Geschwindigkeit",
  "Ich bin bremsbereit",
  "Ich hupe und fahre zügig weiter",
]
why = "Gegenüber Kindern, hilfsbedürftigen und älteren Menschen muss man sich so verhalten, dass eine Gefährdung ausgeschlossen ist, vor allem durch geringere Geschwindigkeit und Bremsbereitschaft."

[questions.en]
q = "An elderly person who seems unsteady is standing at the kerb, wanting to cross. How do you behave?"
o = [
  "I reduce my speed",
  "I am ready to brake",
  "I sound the horn and drive on briskly",
]
why = "Around children, people in need of help and elderly people you must rule out endangering them, above all by slowing down and being ready to brake."

