[questions.de]
q = "Auf einer Autobahn mit drei Fahrstreifen stockt der Verkehr. Sie fahren auf dem mittleren Fahrstreifen. Wohin weichen Sie für die Rettungsgasse aus?"
o = ["Nach rechts", "Nach links", "Gar nicht, ich bleibe in der Mitte"]
why = "Die Rettungsgasse entsteht zwischen dem äußerst linken und dem rechts daneben liegenden Fahrstreifen. Wer links fährt, weicht nach links aus; alle anderen nach rechts."

[questions.en]
q = "Traffic is slowing to a crawl on a three-lane motorway and you are in the middle lane. Which way do you move to form an emergency corridor?"
o = ["To the right", "To the left", "Not at all; I stay in the middle"]
why = "The emergency corridor forms between the leftmost lane and the lane next to it. Drivers in the leftmost lane move left; everyone else moves right."

