[questions.de]
q = "Wie lang ist nach der Faustformel der Bremsweg bei einer normalen Bremsung aus 50 km/h?"
o = ["15 m", "25 m", "50 m"]
why = "Faustformel für den normalen Bremsweg: (Geschwindigkeit in km/h ÷ 10) × (Geschwindigkeit in km/h ÷ 10). Bei 50 km/h: 5 × 5 = 25 m."

[questions.en]
q = "By the rule of thumb, what is the braking distance of a normal stop from 50 km/h?"
o = ["15 m", "25 m", "50 m"]
why = "Rule of thumb for normal braking distance: (speed in km/h ÷ 10) × (speed in km/h ÷ 10). At 50 km/h: 5 × 5 = 25 m."

[[questions]]
id = "G028"
topic = "gefahren"
points = 3
keep_order = true
correct = [1]

[questions.de]
q = "Wie lang ist nach der Faustformel der Reaktionsweg bei 50 km/h?"
o = ["5 m", "15 m", "25 m"]
why = "Faustformel für den Reaktionsweg: (Geschwindigkeit in km/h ÷ 10) × 3. Bei 50 km/h: 5 × 3 = 15 m, zurückgelegt in der knappen Sekunde, bevor die Bremse wirkt."

[questions.en]
q = "By the rule of thumb, what is the reaction distance at 50 km/h?"
o = ["5 m", "15 m", "25 m"]
why = "Rule of thumb for reaction distance: (speed in km/h ÷ 10) × 3. At 50 km/h: 5 × 3 = 15 m, covered in the second or so before the brakes act."

[[questions]]
