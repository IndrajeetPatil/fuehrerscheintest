correct = [1]

[questions.de]
q = "Welche Profiltiefe müssen die Reifen eines Pkw mindestens haben?"
o = ["1,0 mm", "1,6 mm", "3,0 mm"]
why = "Das Hauptprofil muss am ganzen Umfang mindestens 1,6 mm tief sein. Für Sommerreifen werden 3 mm, für Winterreifen 4 mm empfohlen, weil der Bremsweg bei Nässe und Schnee darunter deutlich länger wird."

[questions.en]
q = "What is the minimum tread depth for a car's tyres?"
o = ["1.0 mm", "1.6 mm", "3.0 mm"]
why = "The main tread must be at least 1.6 mm deep all round. 3 mm is recommended for summer tyres and 4 mm for winter tyres, because braking distances on wet and snowy roads grow markedly below that."

[[questions]]
id = "B007"
topic = "technik"
points = 4
law = "§ 2 StVO"
correct = [0]

[questions.de]
q = "Mit welchen Reifen dürfen Sie bei Glatteis, Schneeglätte oder Schneematsch fahren?"
o = [
  "Mit Reifen, die das Alpine-Symbol (Bergpiktogramm mit Schneeflocke) tragen",
  "Mit Sommerreifen, wenn das Profil mindestens 4 mm tief ist",
  "Mit beliebigen Reifen, wenn ich langsam fahre",
]
why = "Bei winterlichen Straßenverhältnissen dürfen Kraftfahrzeuge nur mit Reifen für winterliche Wetterverhältnisse fahren. Diese tragen das Alpine-Symbol."

[questions.en]
q = "Which tyres may you use on black ice, packed snow or slush?"
o = [
  "Tyres marked with the alpine symbol (a mountain with a snowflake)",
  "Summer tyres, if the tread is at least 4 mm deep",
  "Any tyres, if I drive slowly",
]
why = "In wintry conditions, motor vehicles may only use tyres for wintry weather, which carry the alpine symbol."

[[questions]]
