correct = [0]

[questions.de]
q = "Wie verhalten Sie sich vor einer roten Ampel, um Kraftstoff zu sparen?"
o = [
  "Mit eingelegtem Gang ausrollen lassen, so dass die Schubabschaltung wirkt",
  "Auskuppeln und im Leerlauf rollen",
  "Bis kurz vor der Ampel Gas geben und dann stark bremsen",
]
why = "Rollt der Wagen mit eingelegtem Gang, unterbricht die Schubabschaltung die Kraftstoffzufuhr. Im Leerlauf verbraucht der Motor dagegen weiter Kraftstoff."

[questions.en]
q = "How do you save fuel when approaching a red light?"
o = [
  "Let the car coast in gear, so that the fuel cut-off works",
  "Press the clutch and coast in neutral",
  "Keep accelerating until just before the light, then brake hard",
]
why = "When the car coasts in gear, the fuel cut-off stops the fuel supply. In neutral the engine keeps burning fuel."

