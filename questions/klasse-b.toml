[questions.en]
q = "How often must a car undergo the periodic vehicle inspection?"
o = [
  "Every 2 years, a new car for the first time after 3 years",
  "Every year",
  "Every 4 years",
]
why = "Cars must be inspected every 24 months, and newly registered cars for the first time after 36 months."

