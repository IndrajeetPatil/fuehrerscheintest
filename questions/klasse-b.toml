[questions.de]
q = "Wann darf ein rückwärtsgerichteter Kindersitz auf dem Beifahrersitz benutzt werden?"
o = [
  "Nur wenn der Beifahrer-Frontairbag abgeschaltet ist",
  "Immer, wenn das Kind angeschnallt ist",
  "Nur auf kurzen Strecken innerorts",
]
why = "Ein auslösender Frontairbag trifft die Rückenlehne eines rückwärtsgerichteten Kindersitzes mit großer Wucht. Auf einem Sitz mit aktivem Frontairbag ist ein solcher Sitz deshalb nicht zulässig."

[questions.en]
q = "When may a rear-facing child seat be used on the front passenger seat?"
o = [
  "Only when the passenger front airbag is switched off",
  "Always, as long as the child is belted in",
  "Only on short trips in built-up areas",
]
why = "A deploying front airbag strikes the back of a rear-facing child seat with great force, so such a seat is not allowed where the front airbag is active."

[[questions]]
