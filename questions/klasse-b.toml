[questions.de]
q = "Bis zu welcher zulässigen Gesamtmasse dürfen Sie mit Klasse B Kraftfahrzeuge führen?"
o = ["2800 kg", "3500 kg", "7500 kg"]
why = "Klasse B gilt für Kraftfahrzeuge bis 3500 kg zulässiger Gesamtmasse, die für höchstens acht Personen außer dem Fahrer gebaut sind."

[questions.en]
q = "Up to what maximum permitted mass may you drive motor vehicles with a class B licence?"
o = ["2800 kg", "3500 kg", "7500 kg"]
why = "Class B covers motor vehicles up to 3500 kg maximum permitted mass, built to carry no more than eight people besides the driver."

