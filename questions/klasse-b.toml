[questions.de]
q = "Ihr Pkw ist schwer beladen. Was ändert sich?"
o = [
  "Der Bremsweg wird länger",
  "Die Scheinwerfer müssen gegebenenfalls mit der Leuchtweitenregulierung tiefer gestellt werden",
  "Das Fahrzeug wird in Kurven stabiler",
]
why = "Mehr Masse verlängert den Bremsweg und verändert das Fahrverhalten in Kurven. Hinten schwer beladen leuchten die Scheinwerfer höher und blenden, wenn man sie nicht tiefer stellt."

[questions.en]
q = "Your car is heavily loaded. What changes?"
o = [
  "The braking distance gets longer",
  "The headlights may need lowering with the headlight levelling control",
  "The car becomes more stable in bends",
]
why = "More mass lengthens the braking distance and changes handling in bends. Loaded at the back, the headlights point higher and dazzle others unless lowered."

