[questions.de]
q = "Welche Anhänger dürfen Sie mit der Fahrerlaubnis der Klasse B ziehen?"
o = [
  "Anhänger mit einer zulässigen Gesamtmasse von höchstens 750 kg",
  "Schwerere Anhänger, wenn die zulässige Gesamtmasse der Kombination 3500 kg nicht übersteigt",
  "Jeden Anhänger, den das Zugfahrzeug laut Zulassung ziehen darf",
]
why = "Klasse B erlaubt Anhänger bis 750 kg zulässiger Gesamtmasse, schwerere nur, wenn die Kombination insgesamt höchstens 3500 kg zulässige Gesamtmasse hat. Für mehr braucht man B96 oder BE."

[questions.en]
q = "Which trailers may you tow with a class B licence?"
o = [
  "Trailers with a maximum permitted mass of up to 750 kg",
  "Heavier trailers, if the combination's maximum permitted mass does not exceed 3500 kg",
  "Any trailer the towing vehicle is registered to tow",
]
why = "Class B allows trailers up to 750 kg maximum permitted mass, and heavier ones only if the whole combination stays within 3500 kg. Anything more needs B96 or BE."

[[questions]]
