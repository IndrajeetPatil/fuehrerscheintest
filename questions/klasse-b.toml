[questions.de]
q = "Während der Fahrt leuchtet die Öldruck-Kontrollleuchte auf. Was tun Sie?"
o = [
  "So bald wie möglich verkehrsgerecht anhalten und den Motor abstellen",
  "Bis zur nächsten Werkstatt weiterfahren",
  "Den Ölstand prüfen",
]
why = "Ohne Öldruck wird der Motor nicht mehr geschmiert und kann in kurzer Zeit schwer beschädigt werden. Anhalten, Motor abstellen und den Ölstand prüfen."

[questions.en]
q = "While you are driving, the oil pressure warning light comes on. What do you do?"
o = [
  "Stop safely as soon as possible and switch off the engine",
  "Drive on to the next garage",
  "Check the oil level",
]
why = "Without oil pressure the engine is no longer lubricated and can be badly damaged within a short time. Stop, switch off the engine and check the oil level."

