[questions.de]
q = "Ein Kind ist 8 Jahre alt und 130 cm groß. Wie darf es im Pkw mitfahren?"
o = [
  "Nur mit einer für das Kind geeigneten Kinderrückhalteeinrichtung",
  "Mit dem normalen Sicherheitsgurt, weil es älter als 6 Jahre ist",
  "Auf dem Schoß eines Erwachsenen, wenn beide angeschnallt sind",
]
why = "Kinder unter 12 Jahren, die kleiner als 150 cm sind, dürfen auf Sitzen mit Gurtpflicht nur in einer für sie geeigneten Kinderrückhalteeinrichtung mitfahren."

[questions.en]
q = "A child is 8 years old and 130 cm tall. How may they travel in a car?"
o = [
  "Only in a child restraint suited to them",
  "With the normal seat belt, because they are older than 6",
  "On an adult's lap, if both are belted",
]
why = "Children under 12 who are shorter than 150 cm may only travel in seats with seat belts if they use a child restraint suited to them."

