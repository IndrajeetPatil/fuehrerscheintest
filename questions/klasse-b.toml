[questions.de]
q = "Welche Richtgeschwindigkeit gilt auf Autobahnen für Pkw?"
o = ["120 km/h", "130 km/h", "150 km/h"]
why = "Auf Autobahnen ohne Tempolimit gilt für Pkw eine Richtgeschwindigkeit von 130 km/h. Wer schneller fährt, kann bei einem Unfall eine Mithaftung tragen."

[questions.en]
q = "What is the recommended speed for cars on motorways?"
o = ["120 km/h", "130 km/h", "150 km/h"]
why = "On motorways without a speed limit, the recommended speed for cars is 130 km/h. Drivers who go faster can share liability in an accident."

[[questions]]
id = "B006"
