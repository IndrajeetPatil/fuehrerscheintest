[questions.de]
q = "Ab welchem Überstand nach hinten müssen Sie Ladung besonders kenntlich machen, etwa mit einer hellroten Fahne?"
o = [
  "Ab mehr als 0,5 m über die Rückstrahler",
  "Ab mehr als 1 m über die Rückstrahler",
  "Ab mehr als 1,5 m über die Rückstrahler",
]
why = "Ragt Ladung mehr als 1 m über die Rückstrahler hinaus, muss ihr Ende kenntlich gemacht werden, etwa mit einer hellroten Fahne von mindestens 30 × 30 cm."

[questions.en]
q = "From what overhang at the back must a load be specially marked, for example with a bright red flag?"
o = [
  "More than 0.5 m beyond the rear reflectors",
  "More than 1 m beyond the rear reflectors",
  "More than 1.5 m beyond the rear reflectors",
]
why = "If a load sticks out more than 1 m beyond the rear reflectors, its end must be marked, for example with a bright red flag of at least 30 × 30 cm."

[[questions]]
id = "B010"
topic = "technik"
points = 2
correct = [0, 1]

[questions.de]
q = "Wann prüfen Sie den Reifendruck?"
o = [
  "Bei kalten Reifen",
  "Regelmäßig, etwa alle zwei Wochen und vor langen Fahrten oder mit schwerer Beladung",
  "Nur bei der Hauptuntersuchung",
]
why = "Warme Reifen zeigen einen zu hohen Druck an, also misst man kalt. Reifen verlieren langsam Luft; zu wenig Druck verlängert den Bremsweg, verschlechtert die Kurvenstabilität und erhöht den Verbrauch."

[questions.en]
q = "When do you check the tyre pressure?"
o = [
  "When the tyres are cold",
  "Regularly, about every two weeks, and before long journeys or carrying heavy loads",
  "Only at the periodic vehicle inspection",
]
why = "Warm tyres read too high, so measure them cold. Tyres slowly lose air; too little pressure lengthens braking distances, weakens grip in bends and raises consumption."

[[questions]]
id = "B011"
topic = "technik"
points = 3
correct = [0]

[questions.de]
q = "Warum muss die Bremsflüssigkeit regelmäßig erneuert werden?"
o = [
  "Sie nimmt Wasser auf, wodurch ihr Siedepunkt sinkt",
  "Sie verdunstet mit der Zeit",
  "Sie wird mit der Zeit dickflüssig",
]
why = "Bremsflüssigkeit zieht Feuchtigkeit an. Mit dem Wasseranteil sinkt der Siedepunkt, und bei starker Beanspruchung können sich Dampfblasen bilden, so dass die Bremse versagt."

[questions.en]
q = "Why must brake fluid be replaced regularly?"
o = [
  "It absorbs water, which lowers its boiling point",
  "It evaporates over time",
  "It thickens over time",
]
why = "Brake fluid attracts moisture. As its water content rises its boiling point falls, and under heavy use vapour bubbles can form so that the brakes fail."

[[questions]]
id = "B012"
topic = "technik"
points = 3
correct = [0, 1]

[questions.de]
q = "Was bewirkt das Antiblockiersystem (ABS) bei einer Vollbremsung?"
o = [
  "Das Fahrzeug bleibt lenkbar",
  "Die Räder blockieren nicht",
  "Der Bremsweg wird unter allen Umständen kürzer",
]
why = "ABS verhindert, dass die Räder blockieren, so dass das Fahrzeug auch bei einer Vollbremsung lenkbar bleibt. Auf losem Untergrund wie Schotter oder Neuschnee kann der Bremsweg sogar länger werden."

[questions.en]
q = "What does the anti-lock braking system (ABS) do under emergency braking?"
o = [
  "The vehicle can still be steered",
  "The wheels do not lock",
  "The braking distance is shorter in all conditions",
]
why = "ABS stops the wheels from locking, so the vehicle can still be steered under full braking. On loose surfaces such as gravel or fresh snow, the braking distance can even get longer."

