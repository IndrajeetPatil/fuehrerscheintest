[questions.de]
q = "Was gilt beim Rückwärtsfahren?"
o = [
  "Eine Gefährdung anderer muss ausgeschlossen sein, wenn nötig lasse ich mich einweisen",
  "Auf Autobahnen und Kraftfahrstraßen ist es verboten",
  "Beim Rückwärtsfahren habe ich Vorrang",
]
why = "Beim Rückwärtsfahren muss sich der Fahrer so verhalten, dass eine Gefährdung anderer ausgeschlossen ist, erforderlichenfalls mit Einweiser. Auf Autobahnen und Kraftfahrstraßen ist es ganz verboten."

[questions.en]
q = "What applies when reversing?"
o = [
  "I must rule out endangering others, and have someone guide me if necessary",
  "It is prohibited on motorways and expressways",
  "I have priority while reversing",
]
why = "Drivers reversing must rule out endangering others, with someone guiding them if necessary. On motorways and expressways reversing is prohibited altogether."

