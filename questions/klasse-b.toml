[questions.de]
q = "Reicht in der Dämmerung das Tagfahrlicht aus?"
o = [
  "Nein, ich muss die vorgeschriebene Beleuchtung, also das Abblendlicht, einschalten",
  "Ja",
  "Ja, außer auf der Autobahn",
]
why = "In der Dämmerung und bei Dunkelheit ist die vorgeschriebene Beleuchtung zu benutzen. Tagfahrlicht schaltet die Schlussleuchten meist nicht ein, so dass das Fahrzeug von hinten schlecht zu sehen ist."

[questions.en]
q = "Are daytime running lights enough at dusk?"
o = [
  "No, I must switch on the required lights, that is the dipped headlights",
  "Yes",
  "Yes, except on the motorway",
]
why = "At dusk and in the dark, the required lights must be used. Daytime running lights usually leave the rear lights off, so the car is hard to see from behind."

