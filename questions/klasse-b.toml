topic = "betrieb"
points = 3
law = "§ 22 StVO"
correct = [0]

[questions.de]
q = "Wie muss Ladung im Pkw gesichert sein?"
o = [
  "So, dass sie selbst bei einer Vollbremsung oder einem plötzlichen Ausweichen nicht verrutscht, umfällt oder herabfällt",
  "Nur für Fahrten auf der Autobahn",
  "Nur, wenn sie schwerer als 50 kg ist",
]
why = "Ladung muss so verstaut und gesichert sein, dass sie selbst bei Vollbremsung oder plötzlicher Ausweichbewegung nicht verrutschen, umfallen, herabfallen oder vermeidbaren Lärm erzeugen kann."

[questions.en]
q = "How must a load in a car be secured?"
o = [
  "So that it cannot slide, topple or fall even under emergency braking or a sudden swerve",
  "Only for journeys on the motorway",
  "Only if it weighs more than 50 kg",
]
why = "A load must be stowed and secured so that it cannot slide, topple, roll about, fall off or make avoidable noise, even under emergency braking or a sudden swerve."

[[questions]]
