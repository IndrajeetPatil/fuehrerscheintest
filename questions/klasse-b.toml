o = ["30 km/h", "50 km/h", "80 km/h"]
why = "Mit Schneeketten beträgt die Höchstgeschwindigkeit auch unter günstigsten Umständen 50 km/h."

[questions.en]
q = "What is the highest speed you may drive at with snow chains fitted?"
o = ["30 km/h", "50 km/h", "80 km/h"]
why = "With snow chains the speed limit is 50 km/h, even in the best conditions."

