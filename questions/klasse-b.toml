[questions.de]
q = "Wie schnell dürfen Sie mit einem Pkw außerhalb geschlossener Ortschaften auf einer Landstraße mit einem Fahrstreifen je Richtung höchstens fahren?"
o = ["80 km/h", "100 km/h", "120 km/h"]
why = "Außerorts gilt für Pkw 100 km/h. Die Grenze entfällt auf Autobahnen, auf Straßen mit baulich getrennten Richtungsfahrbahnen und auf Straßen mit mindestens zwei markierten Fahrstreifen je Richtung."

[questions.en]
q = "What is the speed limit for a car on a country road with one lane in each direction?"
o = ["80 km/h", "100 km/h", "120 km/h"]
why = "Outside built-up areas the limit for cars is 100 km/h. It does not apply on motorways, dual carriageways or roads with at least two marked lanes in each direction."

[[questions]]
