# Zusatzstoff Klasse B: questions specific to cars. Ten of the thirty
# questions in a class B exam come from here. Same format and rules as
# grundstoff.toml.

[[questions]]
id = "B001"
topic = "verhalten"
points = 3
law = "§ 3 StVO"
keep_order = true
correct = [1]

[questions.de]
q = "Wie schnell dürfen Sie mit einem Pkw innerhalb geschlossener Ortschaften höchstens fahren, wenn nichts anderes angeordnet ist?"
o = ["30 km/h", "50 km/h", "60 km/h"]
why = "Innerhalb geschlossener Ortschaften beträgt die zulässige Höchstgeschwindigkeit für alle Kraftfahrzeuge 50 km/h, sofern Verkehrszeichen nichts anderes anordnen."

[questions.en]
q = "What is the speed limit for a car in built-up areas, unless signs say otherwise?"
o = ["30 km/h", "50 km/h", "60 km/h"]
why = "In built-up areas the speed limit for all motor vehicles is 50 km/h, unless signs say otherwise."

[[questions]]
id = "B002"
