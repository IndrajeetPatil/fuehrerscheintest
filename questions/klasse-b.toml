points = 4
correct = [0]

[questions.de]
q = "Sie fahren ein langes, steiles Gefälle hinab. Wie verhindern Sie, dass die Bremsen überhitzen?"
o = [
  "Einen niedrigen Gang einlegen und die Motorbremse nutzen",
  "Im Leerlauf rollen und mit der Fußbremse bremsen",
  "Dauernd leicht auf der Bremse stehen",
]
why = "Bei Dauerbremsung werden die Bremsen heiß und verlieren Wirkung. Ein niedriger Gang lässt den Motor bremsen; die Fußbremse dient nur zum kurzen, kräftigen Nachbremsen."

[questions.en]
q = "You are driving down a long, steep descent. How do you stop the brakes overheating?"
o = [
  "Select a low gear and use engine braking",
  "Coast in neutral and use the foot brake",
  "Keep the brake lightly pressed all the way",
]
why = "Constant braking makes the brakes hot and weak. A low gear lets the engine do the braking; use the foot brake only for short, firm applications."

