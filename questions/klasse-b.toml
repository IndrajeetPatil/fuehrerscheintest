[questions.de]
q = "Was gilt beim begleiteten Fahren ab 17?"
o = [
  "Ich darf nur mit einer in der Prüfungsbescheinigung namentlich eingetragenen Begleitperson fahren",
  "Die Begleitperson muss mindestens 30 Jahre alt sein",
  "Die Begleitperson darf mir ins Lenkrad greifen und Fahraufgaben übernehmen",
]
why = "Begleitpersonen müssen in der Prüfungsbescheinigung stehen, mindestens 30 Jahre alt sein und seit fünf Jahren Klasse B haben. Sie stehen nur als Ansprechpartner zur Verfügung und geben Rat oder kurze Hinweise."

[questions.en]
q = "What applies to accompanied driving from age 17?"
o = [
  "I may drive only with a companion named on my test certificate",
  "The companion must be at least 30 years old",
  "The companion may grab the wheel and take over driving tasks",
]
why = "Companions must be named on the test certificate, be at least 30 and have held a class B licence for five years. They are there only to talk to, giving advice or brief pointers."

