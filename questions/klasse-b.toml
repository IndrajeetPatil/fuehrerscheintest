[questions.de]
q = "Wie schnell dürfen Sie mit einem Pkw mit Anhänger auf der Autobahn höchstens fahren, wenn keine Ausnahmegenehmigung vorliegt?"
o = ["60 km/h", "80 km/h", "100 km/h"]
why = "Für Pkw mit Anhänger gelten außerorts und auf Autobahnen 80 km/h. Nur mit einer eingetragenen Tempo-100-Zulassung sind auf Autobahnen 100 km/h erlaubt."

[questions.en]
q = "What is the speed limit for a car towing a trailer on the motorway, without a special permit?"
o = ["60 km/h", "80 km/h", "100 km/h"]
why = "Cars towing a trailer are limited to 80 km/h outside built-up areas and on motorways. Only with a registered 100 km/h approval may they go 100 km/h on motorways."

