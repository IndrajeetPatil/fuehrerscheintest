[questions.de]
q = "Was bewirkt die Rekuperation bei einem Elektroauto?"
o = [
  "Beim Verzögern wird Bewegungsenergie in elektrische Energie zurückverwandelt",
  "Der Akku lädt sich im Stand von selbst auf",
  "Das Fahrzeug verzögert spürbar, sobald ich vom Fahrpedal gehe",
]
why = "Bei der Rekuperation arbeitet der Elektromotor als Generator und lädt den Akku. Dabei bremst das Auto spürbar, oft schon ohne Betätigung der Bremse."

[questions.en]
q = "What does regenerative braking do in an electric car?"
o = [
  "When slowing down, kinetic energy is turned back into electrical energy",
  "The battery charges itself while parked",
  "The car slows noticeably as soon as I lift off the accelerator",
]
why = "With regenerative braking the electric motor works as a generator and charges the battery. The car slows noticeably, often without the brake pedal."

