[questions.de]
q = "Was müssen Sie in einem Pkw mitführen?"
o = [
  "Ein Warndreieck",
  "Einen Verbandkasten",
  "Eine Warnweste",
  "Einen Feuerlöscher",
]
why = "In jedem Pkw müssen ein Warndreieck, eine Warnweste und ein Verbandkasten mitgeführt werden. Ein Feuerlöscher ist nur in bestimmten Fahrzeugen wie Bussen vorgeschrieben."

[questions.en]
q = "What must you carry in a car?"
o = [
  "A warning triangle",
  "A first-aid kit",
  "A high-visibility vest",
  "A fire extinguisher",
]
why = "Every car must carry a warning triangle, a high-visibility vest and a first-aid kit. A fire extinguisher is required only in certain vehicles such as buses."

